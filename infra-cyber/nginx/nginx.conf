# SENTINEL-X — reverse proxy HTTPS (image nginx-unprivileged : utilisateur 101, ports > 1024)
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # système de fichiers en lecture seule : tous les fichiers temporaires vont dans /tmp (tmpfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    server_tokens off;                 # pas de version de Nginx dans les réponses
    sendfile on;
    keepalive_timeout 30s;

    # bornes contre les requêtes abusives
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    large_client_header_buffers 4 8k;

    # limitation de débit par IP
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # DNS interne de Docker : les services sont résolus à la requête, Nginx
    # démarre donc même si l'IA n'est pas encore prête.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- HTTP : uniquement redirection vers HTTPS + sonde de santé locale -----------------
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- Relais interne du pont caméra (Windows) vers l'IA ------------------------------
    # Port 8081 JAMAIS publié sur l'hôte : seuls les conteneurs du projet le joignent.
    # Le pont n'écoute que sur 127.0.0.1 de Windows et exige son jeton (transmis par l'IA).
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /camera/stream {
            proxy_pass http://host.docker.internal:8554/stream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_connect_timeout 3s;
        }

        location / {
            return 404;
        }
    }

    # --- HTTPS ---------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /run/certs/server.crt;
        ssl_certificate_key /run/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/sentinel/security-headers.conf;

        set $api_upstream api:8000;
        set $ai_upstream  ai:5000;

        root /usr/share/nginx/html;
        index index.html;

        # fichiers cachés (.git, .env...) : jamais servis
        location ~ /\. {
            deny all;
        }

        # application React (SPA)
        location / {
            limit_req zone=api burst=50 nodelay;
            try_files $uri /index.html;
        }

        location = /index.html {
            expires -1;
        }

        # fichiers compilés (noms avec empreinte) : cache long
        location /assets/ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        # connexion : limite stricte contre le brute force
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/sentinel/proxy.conf;
            proxy_pass http://$api_upstream;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            include /etc/nginx/sentinel/proxy.conf;
            proxy_pass http://$api_upstream;
        }

        # WebSocket temps réel (authentifié par le cookie de session côté API)
        location = /ws/live {
            limit_conn conn 10;
            include /etc/nginx/sentinel/proxy.conf;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_pass http://$api_upstream;
        }

        # flux vidéo de l'IA : servi uniquement aux sessions valides
        location = /video_feed {
            auth_request /_auth;
            limit_conn conn 4;
            include /etc/nginx/sentinel/proxy.conf;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_pass http://$ai_upstream/video_feed;
        }

        location = /_auth {
            internal;
            include /etc/nginx/sentinel/proxy.conf;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://$api_upstream/api/v1/auth/check;
        }
    }
}
