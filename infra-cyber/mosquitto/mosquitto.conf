# SENTINEL-X — broker MQTT durci
# - un seul listener, chiffré (MQTTS 8883, TLS 1.2 minimum) : plus aucun port en clair,
#   y compris à l'intérieur du réseau Docker ;
# - authentification obligatoire (pas d'anonyme) + ACL "refus par défaut".

per_listener_settings false
allow_anonymous false
# fichiers générés au démarrage par entrypoint.sh dans un tmpfs (droits 0600)
password_file /tmp/mosquitto/passwd
acl_file /tmp/mosquitto/acl

# l'identifiant client est forcé au nom d'utilisateur : un client ne peut pas
# usurper l'identifiant d'un autre pour le déconnecter
use_username_as_clientid true
allow_zero_length_clientid false

listener 8883
protocol mqtt
certfile /run/certs/mqtt.crt
keyfile  /run/certs/mqtt.key
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
require_certificate false
max_connections 32

# bornes contre les abus (déni de service)
max_packet_size 4096
max_inflight_messages 20
max_queued_messages 200

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
